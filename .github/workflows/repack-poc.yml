name: repack-poc

on:
  push:
  workflow_dispatch:

jobs:
  build-or-repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Fingerprint the native project
        id: fp
        run: echo "hash=$(npm run --silent fingerprint | jq -r .hash)" >> "$GITHUB_OUTPUT"

      - name: Look for a cached APK with this fingerprint
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/app.apk
          key: android-apk-${{ steps.fp.outputs.hash }}

      - name: Build natively
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-native.sh

      - name: Cache the APK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/app.apk
          key: android-apk-${{ steps.fp.outputs.hash }}

      - name: Repack
        if: steps.cache.outputs.cache-hit == 'true'
        run: scripts/repack.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ steps.fp.outputs.hash }}
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Run Maestro suite on BrowserStack
        id: bs
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        if: env.BROWSERSTACK_USERNAME != ''
        run: |
          if [ -f artifacts/repacked.apk ]; then
            scripts/browserstack-maestro.sh artifacts/repacked.apk
          else
            scripts/browserstack-maestro.sh artifacts/app.apk
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Expo repack POC"
            echo ""
            echo "- Fingerprint: \`${{ steps.fp.outputs.hash }}\`"
            if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
              echo "- Path: **repack** (native build skipped)"
            else
              echo "- Path: **full native build**"
            fi
            if [ -n "${{ steps.bs.outputs.build_id }}" ]; then
              echo "- BrowserStack build: \`${{ steps.bs.outputs.build_id }}\`"
            else
              echo "- BrowserStack: skipped (no secrets)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
