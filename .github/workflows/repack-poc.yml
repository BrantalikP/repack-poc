name: repack-poc

on:
  push:
  workflow_dispatch:

jobs:
  build-or-repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No `cache: gradle` here: android/ is generated by prebuild, so there are
      # no gradle files at this point and the cache step would hard-fail.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # 1) Native fingerprint of the project. Does NOT depend on JS source files.
      - name: Generate fingerprint
        id: fp
        run: |
          HASH=$(npx --yes @expo/fingerprint fingerprint:generate --platform android | jq -r .hash)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Fingerprint: $HASH"

      # 2) The cache key IS the fingerprint, so cache-hit answers
      #    "does a native-compatible binary already exist?".
      #    restore/save are split on purpose: actions/cache saves in a post step
      #    and skips it when the job fails, so a failing test would discard a
      #    19-minute build. Saving explicitly right after the build avoids that.
      - name: Look up APK for this fingerprint
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/app.apk
          key: android-apk-${{ steps.fp.outputs.hash }}

      # 3a) Fingerprint miss -> full native build.
      - name: Full native build (fingerprint miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npx expo prebuild --platform android --clean
          ./android/gradlew -p android assembleRelease --no-daemon
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/app.apk

      - name: Cache the APK for this fingerprint
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/app.apk
          key: android-apk-${{ steps.fp.outputs.hash }}

      # 3b) Fingerprint hit -> repack only. This is what the POC verifies.
      - name: Repack (fingerprint hit)
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          npx --yes @expo/repack-app@latest \
            --platform android \
            --source-app artifacts/app.apk \
            --output artifacts/repacked.apk \
            --verbose

      # 4) Publish the binary before testing starts: a cancelled or timed-out
      #    test phase must not throw away a 19-minute native build, and a failing
      #    flow is easier to debug with the APK already downloadable.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ steps.fp.outputs.hash }}
          path: artifacts/*.apk
          if-no-files-found: warn

      # 5) Run the flows on a real device. They assert the exact JS marker, so a
      #    passing build is proof the repacked bundle is the new one.
      #    Skipped entirely when BrowserStack secrets are not configured.
      - name: Run Maestro flows on BrowserStack
        id: bs
        env:
          BS_USER: ${{ secrets.BROWSERSTACK_USERNAME }}
          BS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        if: env.BS_USER != ''
        run: |
          set -euo pipefail
          # Not `ls a b | head -1`: ls exits 2 when a file is missing, and with
          # pipefail that kills the step on the full-build path.
          if [ -f artifacts/repacked.apk ]; then
            APK=artifacts/repacked.apk
          else
            APK=artifacts/app.apk
          fi
          MARKER=$(sed -n "s/^const JS_MARKER = '\(.*\)';$/\1/p" App.tsx)
          echo "Testing $APK, expecting marker: $MARKER"

          # Bake the expected marker into every flow, then zip the suite.
          # BrowserStack requires a single parent folder inside the zip; with the
          # flows at the archive root it silently ran only one of them.
          rm -rf build/suite && mkdir -p build/suite/flows
          cp .maestro/*.yaml build/suite/flows/
          sed -i "s/__MARKER__/$MARKER/g" build/suite/flows/*.yaml
          (cd build/suite && zip -qr ../flows.zip flows)

          # Without `execute`, only root-level flows of the parent folder run.
          # List them explicitly so the request states what is expected to run.
          EXECUTE=$(cd build/suite/flows && ls *.yaml | jq -R . | jq -sc .)
          echo "Flows in suite: $EXECUTE"

          BS=https://api-cloud.browserstack.com/app-automate/maestro/v2
          APP_URL=$(curl -sS -u "$BS_USER:$BS_KEY" -X POST "$BS/app" \
            -F "file=@$APK" -F "custom_id=repack-poc" | jq -r .app_url)
          SUITE_URL=$(curl -sS -u "$BS_USER:$BS_KEY" -X POST "$BS/test-suite" \
            -F "file=@build/flows.zip" -F "custom_id=repack-poc-flows" | jq -r .test_suite_url)
          echo "app=$APP_URL suite=$SUITE_URL"

          BUILD_ID=$(curl -sS -u "$BS_USER:$BS_KEY" -X POST "$BS/android/build" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg a "$APP_URL" --arg t "$SUITE_URL" --argjson e "$EXECUTE" \
                  '{app:$a, testSuite:$t, project:"repack-poc", execute:$e,
                    devices:["Google Pixel 7-13.0"]}')" | jq -r '.build_id // .buildId')
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          # Poll until the build leaves the queued/running states.
          STATUS=unknown
          for _ in $(seq 1 60); do
            STATUS=$(curl -sS -u "$BS_USER:$BS_KEY" "$BS/builds/$BUILD_ID" | jq -r .status)
            echo "status=$STATUS"
            case "$STATUS" in
              queued|running) sleep 15 ;;
              *) break ;;
            esac
          done
          if [ "$STATUS" != passed ]; then
            echo "BrowserStack build did not pass: $STATUS"
            exit 1
          fi

          # A build reports "passed" even when it silently ran a subset of the
          # suite, so assert that every flow actually executed.
          EXPECTED=$(echo "$EXECUTE" | jq length)
          RAN=$(curl -sS -u "$BS_USER:$BS_KEY" "$BS/builds/$BUILD_ID" \
            | jq '[.devices[].sessions[].testcases.count] | add // 0')
          echo "flows expected=$EXPECTED ran=$RAN"
          if [ "$RAN" != "$EXPECTED" ]; then
            echo "Only $RAN of $EXPECTED flows ran"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Expo repack POC"
            echo ""
            echo "- Fingerprint: \`${{ steps.fp.outputs.hash }}\`"
            if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
              echo "- Path taken: **repack** (native build skipped)"
            else
              echo "- Path taken: **full native build** (no APK cached for this fingerprint)"
            fi
            if [ -n "${{ steps.bs.outputs.build_id }}" ]; then
              echo "- BrowserStack Maestro build: \`${{ steps.bs.outputs.build_id }}\`"
            else
              echo "- BrowserStack: skipped (no secrets configured)"
            fi
            echo ""
            echo "Artifacts:"
            ls -lh artifacts 2>/dev/null || echo "  (none)"
          } >> "$GITHUB_STEP_SUMMARY"
